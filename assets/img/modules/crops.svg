    <rect x="26" y="252" width="145" height="6" rx="3" fill="url(#grad)"><animate attributeName="width" values="0;145" dur="1.2s" fill="freeze"/></rect>
    <text x="190" y="260" font-size="10" font-weight="800" fill="#2E7D32">92%</text>
    <g font-size="7" font-weight="700">
      <rect x="26" y="266" width="74" height="18" rx="9" fill="#E8F5E9"/><text x="34" y="279" fill="#2E7D32">₹ High demand</text>
      <rect x="108" y="266" width="92" height="18" rx="9" fill="#FFF8E1"/><text x="116" y="279" fill="#E65100">🕒 4-month cycle</text>
