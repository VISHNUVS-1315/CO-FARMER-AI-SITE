    <rect x="26" y="342" width="38" height="38" rx="11" fill="#E3F2FD"/>
    <text x="35" y="367" font-size="16">🌱</text>
    <text x="72" y="358" font-size="10.5" font-weight="800" fill="#1F2937">Cotton</text>
    <text x="72" y="372" font-size="7.5" fill="#6B7280">8-10 q/acre · 5.5 months · Low water</text>
    <rect x="26" y="382" width="158" height="6" rx="3" fill="#E8EFE8"/>
    <rect x="26" y="382" width="123" height="6" rx="3" fill="url(#grad)"/>
    <text x="190" y="390" font-size="10" font-weight="800" fill="#2E7D32">78%</text>
    <g font-size="7" font-weight="700">
      <rect x="26" y="396" width="90" height="18" rx="9" fill="#FFEBEE"/><text x="34" y="409" fill="#D32F2F">⚠ Bollworm risk</text>
      <rect x="124" y="396" width="96" height="18" rx="9" fill="#E8F5E9"/><text x="132" y="409" fill="#2E7D32">🛡 Plan included</text>
    </g>
    <rect x="26" y="422" width="120" height="20" rx="10" fill="none" stroke="#2E7D32" stroke-width="1.3"/>
    <text x="42" y="436" font-size="8" font-weight="800" fill="#2E7D32">Detailed plan →</text>
  </g>

  <rect x="16" y="466" width="268" height="70" rx="16" fill="#FFF8E1" stroke="#FFE082" filter="url(#s)"/>
  <rect x="26" y="476" width="24" height="24" rx="8" fill="#FFB300"/>
  <text x="33" y="493" font-size="11">🤖</text>
  <text x="58" y="490" font-size="9.5" font-weight="800" fill="#8D6E63">Why these crops?</text>
  <text x="26" y="508" font-size="8.5" fill="#6B7280">Soil, water, climate and your market area are</text>
  <text x="26" y="521" font-size="8.5" fill="#6B7280">scored together. Rotation idea: groundnut next.</text>

  <rect x="0" y="592" width="300" height="48" fill="#FFFFFF" stroke="#E8F0E8"/>
  <text x="38" y="626" font-size="13" fill="#9CA3AF">🏠</text>
  <text x="102" y="626" font-size="12" fill="#9CA3AF">💬</text>
  <text x="152" y="626" font-size="12" fill="#9CA3AF">🧭</text>
  <rect x="190" y="600" width="40" height="4" rx="2" fill="#2E7D32"/>
  <text x="206" y="626" font-size="12" fill="#2E7D32">☰</text>
  <circle cx="258" cy="616" r="11" fill="url(#grad)"/><text x="252" y="620" font-size="10" fill="#fff">＋</text>
</svg>
