  <text x="248" y="60" font-size="11" fill="#6B7280">⋮</text>

  <text x="16" y="102" font-size="10" font-weight="800" fill="#1F2937">Your farm profile</text>
  <g font-size="7.5" font-weight="700" fill="#374151">
    <rect x="16" y="110" width="88" height="28" rx="9" fill="#E8F5E9"/><text x="28" y="128" fill="#2E7D32">🌱 Loamy soil</text>
    <rect x="112" y="110" width="68" height="28" rx="9" fill="#E8F5E9"/><text x="124" y="128" fill="#2E7D32">pH 6.8</text>
    <rect x="188" y="110" width="96" height="28" rx="9" fill="#E8F5E9"/><text x="200" y="128" fill="#2E7D32">💧 850mm rain</text>
    <rect x="16" y="144" width="96" height="28" rx="9" fill="#E8F5E9"/><text x="28" y="162" fill="#2E7D32">🌡️ 24-32°C</text>
    <rect x="120" y="144" width="164" height="28" rx="9" fill="#E8F5E9"/><text x="132" y="162" fill="#2E7D32">💰 Borewell irrigation</text>
  </g>

  <text x="16" y="194" font-size="10" font-weight="800" fill="#1F2937">Best crops for you</text>

  <g filter="url(#s)">
