    <circle cx="34" cy="266" r="11" fill="#FFF3E0"/><text x="27" y="270" font-size="10">☀</text>
    <text x="52" y="270" fill="#1F2937">Tue</text><text x="100" y="270" fill="#9CA3AF">Clear sky</text>
    <text x="216" y="271" font-size="11" font-weight="800" fill="#1F2937">33°</text><text x="252" y="271" fill="#9CA3AF">27°</text>
    <rect x="16" y="292" width="268" height="40" rx="12" fill="#FFFFFF" stroke="#E8F0E8" filter="url(#s)"/>
    <circle cx="34" cy="312" r="11" fill="#E8F0FE"/><text x="27" y="316" font-size="10">⛅</text>
    <text x="52" y="316" fill="#1F2937">Wed</text><text x="100" y="316" fill="#9CA3AF">Partly cloudy</text>
    <text x="216" y="317" font-size="11" font-weight="800" fill="#1F2937">31°</text><text x="252" y="317" fill="#9CA3AF">26°</text>
    <rect x="16" y="338" width="268" height="40" rx="12" fill="#FFFFFF" stroke="#E8F0E8" filter="url(#s)"/>
    <circle cx="34" cy="358" r="11" fill="#E8F0FE"/><text x="27" y="362" font-size="10">🌦</text>
    <text x="52" y="362" fill="#1F2937">Thu</text><text x="100" y="362" fill="#9CA3AF">Light showers</text>
    <text x="216" y="363" font-size="11" font-weight="800" fill="#1F2937">29°</text><text x="252" y="363" fill="#9CA3AF">25°</text>
    <rect x="16" y="384" width="268" height="40" rx="12" fill="#FFFFFF" stroke="#E8F0E8" filter="url(#s)"/>
    <circle cx="34" cy="404" r="11" fill="#E8F0FE"/><text x="27" y="408" font-size="10">🌧</text>
    <text x="52" y="408" fill="#1F2937">Fri</text><text x="100" y="408" fill="#9CA3AF">Rain expected</text>
    <text x="216" y="409" font-size="11" font-weight="800" fill="#1F2937">28°</text><text x="252" y="409" fill="#9CA3AF">24°</text>
  </g>

  <rect x="16" y="436" width="268" height="82" rx="16" fill="#FFF8E1" stroke="#FFE082" filter="url(#s)"/>
  <rect x="26" y="446" width="24" height="24" rx="8" fill="#FFB300"/>
  <text x="33" y="463" font-size="11">🌾</text>
  <text x="58" y="460" font-size="9.5" font-weight="800" fill="#8D6E63">AI Farm Insight</text>
  <text x="26" y="482" font-size="8.5" fill="#6B7280">Rain on Friday — top-dress your tomato crop</text>
  <text x="26" y="495" font-size="8.5" fill="#6B7280">today and push irrigation +1 day.</text>
  <rect x="26" y="504" width="92" height="16" rx="8" fill="url(#grad)"/>
  <text x="42" y="515" font-size="7.5" font-weight="800" fill="#fff">Plan a Task →</text>

  <rect x="0" y="592" width="300" height="48" fill="#FFFFFF" stroke="#E8F0E8"/>
  <text x="38" y="626" font-size="13" fill="#9CA3AF">🏠</text>
  <text x="102" y="626" font-size="12" fill="#9CA3AF">💬</text>
  <rect x="136" y="600" width="40" height="4" rx="2" fill="#2E7D32"/>
  <text x="152" y="626" font-size="12" fill="#2E7D32">🧭</text>
  <text x="206" y="626" font-size="12" fill="#9CA3AF">☰</text>
  <circle cx="258" cy="616" r="11" fill="url(#grad)"/><text x="252" y="620" font-size="10" fill="#fff">＋</text>
</svg>
